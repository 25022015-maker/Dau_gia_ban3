# =============================================
#  SERVER
# =============================================
server.port=8080

# =============================================
#  DATABASE  (giữ nguyên thông tin DB của nhóm)
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/auction_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
#  JPA / HIBERNATE
# =============================================
# update: tự tạo/sửa bảng theo Entity khi khởi động
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
#  JWT
# =============================================
# Secret key phải >= 256 bit (32 ký tự)
app.jwt.secret=AuctionSystem2024SecretKeyMust32CharLong!!
app.jwt.expiration-ms=86400000

# =============================================
#  AUCTION SCHEDULER
# =============================================
# Số giây cuối phiên mà anti-sniping kích hoạt (ví dụ: 60 giây cuối)
app.auction.anti-snipe-trigger-seconds=60
# Số giây gia hạn khi bid trong giai đoạn anti-sniping
app.auction.anti-snipe-extension-seconds=60

# =============================================
#  LOGGING
# =============================================
logging.level.com.auction=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
